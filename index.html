<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Weather Application</title>

    <link rel="stylesheet" href="src/styles.css" />
  </head>

  <body>
    <div class="weather-app">
      <header>
        <form>
          <input
            type="search"
            class="search-input"
            placeholder="Enter a city.."
            aria-label="Enter a city"
            required
          />

          <input type="submit" class="search-button" value="Search" />
        </form>
      </header>

      <main>
        <div class="current-weather">
          <div>
            <h1 class="current-city">Paris</h1>

            <p class="current-details">
              Saturday 15:32, moderate rain
              <br />
              Humidity: <strong>87%</strong>, Wind: <strong>7.2km/h</strong>
            </p>
          </div>

          <div class="current-temperature">
            <span class="current-temperature-icon">☀️</span>
            <span class="current-temperature-value">14</span>
            <span class="current-temperature-unit">°C</span>
          </div>
        </div>
      </main>

      <footer>
        <p>
          This project was coded by Precious Memory Maromo and is
          <a href="YOUR_GITHUB_LINK">on GitHub</a>
          and hosted on
          <a href="YOUR_NETLIFY_LINK">Netlify</a>.
        </p>
      </footer>
    </div>
  </body>
</html>
